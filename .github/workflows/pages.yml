name: Publish India Land Search to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'worker/odisha-map-snapshots.json'
      - 'scripts/offline-assets.mjs'
      - 'build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
      - run: node build-pages.mjs
      - run: node scripts/smoke-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out
      - uses: actions/deploy-pages@v4
        id: deploy

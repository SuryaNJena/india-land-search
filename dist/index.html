<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Review land records, surname variants, cadastral maps and Records of Rights in your browser.">
  <title>India Land Search</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="field-panorama.css"><link rel="icon" href="./app-icon.svg" type="image/svg+xml"><link rel="alternate icon" href="./favicon.png" type="image/png">
  <meta name="theme-color" content="#25192b"><link rel="manifest" href="app.webmanifest">
  <script defer src="vendor/jszip.js"></script><script defer src="vendor/pdf-lib.js"></script>
  <script defer src="vendor/sanscript.js"></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" id="app-brand" href="./"><span class="brand-icon" aria-hidden="true">◫</span><span>India Land Search</span></a>
    <button id="nav-toggle" aria-controls="workspace-nav" aria-expanded="false">☰ &nbsp;Menu</button>
    <nav id="workspace-nav" aria-label="Workspace navigation">
      <button class="nav active" data-view="overview" aria-label="Home" aria-describedby="nav-overview"><span aria-hidden="true">▦</span><span class="nav-copy">Home<small class="nav-purpose" id="nav-overview">Search by name and village.</small></span></button>
      <button class="nav" data-view="plots" aria-label="Plot records" aria-describedby="nav-plots"><span aria-hidden="true">≡</span><span class="nav-copy">Plot records<small class="nav-purpose" id="nav-plots">Look up plot details.</small></span></button>
      <button class="nav" data-view="names" aria-label="Name matching" aria-describedby="nav-names"><span aria-hidden="true">Aa</span><span class="nav-copy">Name matching<small class="nav-purpose" id="nav-names">Review and save spellings.</small></span></button>
      <button class="nav" data-view="maps" aria-label="Village maps" aria-describedby="nav-maps"><span aria-hidden="true">▧</span><span class="nav-copy">Village maps<small class="nav-purpose" id="nav-maps">Explore villages and parcels.</small></span></button>
      <button class="nav" data-view="ror" aria-label="Records of Rights" aria-describedby="nav-ror"><span aria-hidden="true">▤</span><span class="nav-copy">Records of Rights<small class="nav-purpose" id="nav-ror">Open and export RoRs.</small></span></button>
      <button class="nav" data-view="workspace" aria-label="Workspace" aria-describedby="nav-workspace"><span aria-hidden="true">▤</span><span class="nav-copy">Workspace<small class="nav-purpose" id="nav-workspace">Manage saved records.</small></span></button>
      <button class="nav" data-view="portals" aria-label="State portals" aria-describedby="nav-portals"><span aria-hidden="true">◎</span><span class="nav-copy">State portals<small class="nav-purpose" id="nav-portals">Find official land portals.</small></span></button>
    </nav>
    <div class="sidebar-foot"><span class="local-dot"></span><div>Browser storage<small>Back up to move between devices</small></div></div>
  </aside>
  <main>
    <header class="top"><div><div id="crumb">Land records</div><h1 id="heading">Home</h1></div>
      <a class="demo-exit" id="demo-exit" aria-label="Exit demo" href="./" hidden>×</a>
      <div class="top-actions"><button id="take-tour" class="button secondary">Take a tour</button><button id="backup" class="button secondary" disabled>Back up workspace</button><button id="import" class="button secondary">Import records</button><input id="file" type="file" accept=".zip,.json,.xlsx,.xlsm" hidden></div>
    </header>
    <div id="status" role="status" aria-live="polite" hidden></div>
    <div id="view"></div>
  </main>
  <dialog id="detail"><form method="dialog"><button class="button secondary" aria-label="Close plot details">Close</button></form><div id="detail-content"></div></dialog>
</body></html>
